name: Frontend tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
      # Checked-in inputs consumed by frontend units and fixture-backed browsers.
      - "docs/review_packets/record_at_a_glance_v1/**"
      - "docs/review_packets/education79_locator_v1/prepared/expected-public-after.json.gz"
      - "docs/review_packets/record_across_congresses_frontend_copy_guardrails.json"
      - "docs/editorial/analytical_candidates/f000477_education_workforce_m14d_v1/accepted_behavioral_findings.json"
      - "docs/editorial/public_wording_candidates/f000477_education_workforce_m14f_v1/accepted_public_copy.json"
      - "docs/editorial/publication_replacements/m15b_green_activation_execution/after-justice-live.json.gz"
      - "docs/reviews/m15b_interpretive_trust/**"
      - "docs/editorial/full_record_reviews/site_integration_candidates/f000477_national_security_foreign_119_v1/**"
      - "docs/editorial/full_record_reviews/site_integration_candidates/f000477_environment_energy_119_v1/**"
      - "docs/editorial/full_record_reviews/site_integration_candidates/f000477_education_workforce_119_v1/**"
      - "docs/editorial/site_integration_candidates/f000477_education_workforce_m14g_v1/**"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
      - "docs/review_packets/record_at_a_glance_v1/**"
      - "docs/review_packets/education79_locator_v1/prepared/expected-public-after.json.gz"
      - "docs/review_packets/record_across_congresses_frontend_copy_guardrails.json"
      - "docs/editorial/analytical_candidates/f000477_education_workforce_m14d_v1/accepted_behavioral_findings.json"
      - "docs/editorial/public_wording_candidates/f000477_education_workforce_m14f_v1/accepted_public_copy.json"
      - "docs/editorial/publication_replacements/m15b_green_activation_execution/after-justice-live.json.gz"
      - "docs/reviews/m15b_interpretive_trust/**"
      - "docs/editorial/full_record_reviews/site_integration_candidates/f000477_national_security_foreign_119_v1/**"
      - "docs/editorial/full_record_reviews/site_integration_candidates/f000477_environment_energy_119_v1/**"
      - "docs/editorial/full_record_reviews/site_integration_candidates/f000477_education_workforce_119_v1/**"
      - "docs/editorial/site_integration_candidates/f000477_education_workforce_m14g_v1/**"

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      # Opt-in fixtures apply only to this runner's production build/server.
      PLAYWRIGHT_PRODUCTION_BUILD: "1"
      ENABLE_ZIP_LOOKUP_STATE_FIXTURE: "1"
      ENABLE_M6_REVIEW_FIXTURE: "1"
      ENABLE_RECORD_CARD_REVIEW: "1"
      PLAYWRIGHT_HTML_OPEN: "never"
      PLAYWRIGHT_JSON_OUTPUT_FILE: "ci-results/browser-results.json"
      PASS_A_SCREENSHOT_DIR: "ci-results/pass-a"
      RECORD_CARD_SCREENSHOT_DIR: "ci-results/record-card"
      RECORD_CARD_RELEASE_SCREENSHOT_DIR: "ci-results/record-card-release"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ci-results
          actual_sha="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA" "$actual_sha" | tee ci-results/checkout.txt
          test "$actual_sha" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee ci-results/install.log

      - name: Run all frontend unit contracts
        run: node --test lib/*.test.mjs 2>&1 | tee ci-results/units.log

      - name: Lint frontend
        run: npm run lint 2>&1 | tee ci-results/lint.log

      - name: Build production frontend
        run: npm run build 2>&1 | tee ci-results/build.log

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium 2>&1 | tee ci-results/browser-install.log

      - name: Run fixture-backed browser regressions against production build
        run: |
          # No live-review/acquisition, domain regeneration, backend or Postgres.
          # Historical domain integration/review-packet suites are outside this lane.
          npx --no-install playwright test \
            tests/representative-finder.spec.mjs \
            tests/official-contact.spec.mjs \
            tests/local-record-filter.spec.mjs \
            tests/frontend-pass-a.spec.mjs \
            tests/frontend-loading-anchors.spec.mjs \
            tests/zip-lookup-state.spec.mjs \
            tests/editorial-cutover.spec.mjs \
            tests/ir-presentation.spec.mjs \
            tests/production-evidence-integration.spec.mjs \
            tests/public-record-integrity.spec.mjs \
            tests/record-card.spec.mjs \
            tests/record-card-release.spec.mjs \
            tests/education79-card-compatibility.spec.mjs \
            --workers=2 --retries=0 --forbid-only \
            --trace=retain-on-failure --reporter=line,json,html \
            2>&1 | tee ci-results/browsers.log

      # bash runs with -e -o pipefail: tee cannot hide failed validation.
      # Upload even after failure; reports include retained traces/screenshots.
      - name: Retain frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/ci-results/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  amendment-evidence-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run amendment evidence backend tests
        run: >-
          pytest
          tests/test_amendment_evidence.py
          tests/test_source_packets.py
          tests/test_amendment_companion_enrichment.py
          tests/test_supervised_enrichment.py
          tests/test_manual_interpretations.py
          tests/test_senate_evidence_classification.py
          tests/test_senate_enrichment_phase21.py
          tests/test_senate_118_amendment_enrichment.py
          tests/test_evidence_118_expansion.py
          tests/test_session2_evidence_expansion.py
          tests/test_api_positions.py
          tests/test_api_alignment.py

  publication-activation-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://invalid
      EDITORIAL_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_activation
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare frozen disposable editorial state
        run: |
          createdb -h 127.0.0.1 -U postgres pf_activation
          python backend/scripts/prepare_editorial_artifact_disposable.py
          python backend/scripts/editorial_artifact_store.py \
            --apply \
            --target disposable \
            --batch-key editorial-artifact-persistence-v1-88d6f344 \
            --source-commit 88d6f3446f54b07735e084cbc958c1614b190fab \
            --manifest-sha256 f8c4c24f00f3835b4c1a82e415ae7f2fde77002529b3cc3a23d0785c15efd726 \
            --migration-sha256 b4fffce458ebda4b09ce92cd1998468c4d18bad2450e43e9567776340337a9f7

      - name: Run publication activation PostgreSQL suite without skips
        run: >-
          pytest -q
          backend/tests/test_foushee_justice_publication_activation_postgres.py
          -rs

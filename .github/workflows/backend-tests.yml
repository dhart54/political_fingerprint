name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  m14h-exact-head:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      M14H_DISPOSABLE_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/pf_m14h
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install M14H validation dependencies
        run: python -m pip install -r backend/requirements.txt httpx

      - name: Prove exact M14H package and unchanged V2/migration contracts
        run: |
          git rev-parse HEAD
          python -m pytest -q \
            backend/tests/test_m14h_education_publication_replacement.py \
            backend/tests/test_publication_activation_governance_v2.py \
            backend/tests/test_m11n_national_security_publication_activation.py \
            backend/tests/test_m12n_environment_energy_publication_preparation.py \
            backend/tests/test_m13n_r_education_publication_preparation.py \
            backend/tests/test_m13n_education_workforce_ratification_candidate.py

      - name: Prove disposable M14H apply, idempotency, faults, rollback, and public selector
        run: |
          createdb -h 127.0.0.1 -U postgres pf_m14h
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --database-url-env M14H_DISPOSABLE_DATABASE_URL \
            --seed-foushee-activation-baseline
          python -m pytest -q \
            backend/tests/test_m14h_education_publication_replacement_postgres.py \
            -rs

      - name: Run accepted M14G and public-receipt regressions
        run: |
          python backend/scripts/build_m14g_education_workforce_site_integration.py --check
          python scripts/build_m14g_site_integration_acceptance.py --check
          python -m pytest -q \
            backend/tests/test_m14g_education_workforce_site_integration.py \
            backend/tests/test_m14g_site_integration_acceptance.py
          cd frontend
          node --test \
            lib/m14gEducationWorkforce.test.mjs \
            lib/publicReceipt.test.mjs \
            lib/selectedIssueExperience.test.mjs

      - name: Run release-tier editorial, frontend, and persistence validation
        run: >-
          python scripts/run_editorial_pipeline.py validate --tier release
          --include-frontend --include-persistence

  m14g-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install M14G focused validation dependencies
        run: python -m pip install -r backend/requirements.txt httpx

      - name: Validate detached M14G candidate and exact receipt semantics
        run: |
          git rev-parse HEAD
          python backend/scripts/build_m14g_education_workforce_site_integration.py --check
          python scripts/build_m14g_site_integration_acceptance.py --check --check-scope
          python -m pytest -q backend/tests/test_m14g_education_workforce_site_integration.py
          python -m pytest -q backend/tests/test_m14g_site_integration_acceptance.py
          python -m pytest -q backend/tests/test_m13n_education_workforce_ratification_candidate.py
          cd frontend
          node --test lib/m14gEducationWorkforce.test.mjs
          cd ..
          python scripts/validate_m14g_education_workforce_site_integration.py

      - name: Run required M14A-M14F regressions
        run: |
          python scripts/build_shared_justice_corpus_m14a.py --check
          python scripts/build_m14b_action_interpretability.py --check
          python scripts/build_m14c_source_hold_closure.py --check
          python scripts/build_m14d_education_reanalysis.py --check
          python scripts/build_m14e_education_synthesis.py --check
          python scripts/build_m14e_synthesis_acceptance.py --check
          python scripts/build_m14f_education_public_wording.py --check
          python scripts/build_m14f_public_wording_acceptance.py --check
          python -m pytest -q \
            backend/tests/test_m14c_source_hold_closure.py \
            backend/tests/test_m14d_education_reanalysis.py \
            backend/tests/test_accepted_findings_synthesis.py \
            backend/tests/test_accepted_findings_public_wording.py

  m14f-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install M14F offline validation dependencies
        run: python -m pip install jsonschema pytest

      - name: Validate detached M14F wording and prominence review
        run: |
          git rev-parse HEAD
          python scripts/build_m14f_education_public_wording.py --check
          python scripts/build_m14f_public_wording_acceptance.py --check
          python -m pytest -q backend/tests/test_accepted_findings_public_wording.py

      # The milestone allowlist applies only to this exact candidate branch.
      - name: Prove exact M14F milestone scope
        if: github.head_ref == 'codex/m14f-education-public-wording'
        run: |
          python scripts/build_m14f_education_public_wording.py --check --check-scope
          python scripts/build_m14f_public_wording_acceptance.py --check --check-scope

  m14e-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install M14E offline validation dependencies
        run: python -m pip install jsonschema pytest

      - name: Validate detached M14E synthesis and frozen accepted inputs
        run: |
          git rev-parse HEAD
          python scripts/build_m14e_education_synthesis.py --check
          python -m pytest -q backend/tests/test_accepted_findings_synthesis.py

      - name: Validate exact user-approved M14E internal synthesis acceptance
        run: python scripts/build_m14e_synthesis_acceptance.py --check

      - name: Prove exact M14E milestone scope
        if: github.head_ref == 'codex/m14e-education-synthesis-review'
        run: |
          python scripts/build_m14e_education_synthesis.py --check --check-scope
          python scripts/build_m14e_synthesis_acceptance.py --check --check-scope

  m14d-exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install M14D offline validation dependencies
        run: python -m pip install jsonschema pytest

      - name: Validate M14D promotion, detached candidates, and frozen baseline
        run: |
          git rev-parse HEAD
          python scripts/build_m14d_education_reanalysis.py --check
          python -m pytest -q backend/tests/test_m14d_education_reanalysis.py

      # The milestone diff allowlist is not a permanent ban on future work.
      - name: Prove exact M14D milestone scope
        if: github.head_ref == 'codex/m14d-education-reanalysis'
        run: python scripts/build_m14d_education_reanalysis.py --check --check-scope

  foushee-full-record-benchmark:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://invalid
      EDITORIAL_DISPOSABLE_DATABASE_URL: postgresql://invalid
      UNIVERSE_DISCOVERY_DISPOSABLE_DATABASE_URL: postgresql://invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx==0.28.1

      - name: Validate M14A shared corpus boundary
        run: |
          python scripts/build_shared_justice_corpus_m14a.py --check
          python -m pytest -q backend/tests/test_shared_legislative_corpus.py

      - name: Validate M14B action interpretability contract
        run: |
          python scripts/build_m14b_action_interpretability.py --check
          python -m pytest -q backend/tests/test_action_interpretability_v1.py

      - name: Validate M14C Education source-hold closure
        run: |
          python scripts/build_m14c_source_hold_closure.py --check
          python -m pytest -q backend/tests/test_m14c_source_hold_closure.py

      - name: Validate governed M1-M7 chain and layered benchmark
        run: |
          python scripts/validate_full_issue_universe_authority.py
          python scripts/validate_full_issue_interpretation_source_readiness.py
          python backend/scripts/build_full_issue_interpretation_source_readiness.py --check
          python scripts/validate_m11a_universe_authority.py
          python scripts/validate_m11b_national_security_source_readiness.py
          python scripts/validate_m12a_next_full_record_issue_selection.py
          python scripts/validate_m12a_universe_authority.py
          python scripts/validate_m12b_environment_energy_source_readiness.py
          python backend/scripts/build_m13b_education_workforce_source_readiness_v2.py --check
          python scripts/validate_m13b_education_workforce_source_readiness_v2.py
          python backend/scripts/build_m13c_education_workforce_action_interpretation.py --check
          python scripts/validate_m13c_education_workforce_action_interpretation.py
          python backend/scripts/build_m13d_education_workforce_action_meaning_acceptance.py --check
          python scripts/validate_m13d_education_workforce_action_meaning_acceptance.py
          python backend/scripts/build_m13e_education_workforce_policy_episode_candidates.py --check
          python scripts/validate_m13e_education_workforce_policy_episode_candidates.py
          python backend/scripts/build_m13f_education_workforce_policy_episode_acceptance.py --check
          python scripts/validate_m13f_education_workforce_policy_episode_acceptance.py
          python backend/scripts/build_m13g_education_workforce_behavioral_semantic_ir_candidates.py --check
          python scripts/validate_m13g_education_workforce_behavioral_semantic_ir_candidates.py
          python backend/scripts/build_m13h_education_workforce_semantic_ir_acceptance.py --check
          python scripts/validate_m13h_education_workforce_semantic_ir_acceptance.py
          python backend/scripts/build_m13i_education_workforce_synthesis_candidates.py --check
          python scripts/validate_m13i_education_workforce_synthesis_candidates.py
          python backend/scripts/build_m13j_education_workforce_synthesis_acceptance.py --check
          python scripts/validate_m13j_education_workforce_synthesis_acceptance.py
          python backend/scripts/build_m13k_education_workforce_public_wording_candidates.py --check
          python scripts/validate_m13k_education_workforce_public_wording_candidates.py
          python backend/scripts/build_m13l_education_workforce_public_wording_acceptance.py --check
          python scripts/validate_m13l_education_workforce_public_wording_acceptance.py
          python scripts/validate_m12c_environment_energy_action_interpretation.py
          python scripts/validate_m11d_national_security_action_meaning_acceptance.py
          python scripts/validate_m12d_environment_energy_action_meaning_acceptance.py
          python scripts/validate_m11e_national_security_policy_episode_candidates.py
          python scripts/validate_m12e_environment_energy_policy_episode_candidates.py
          python scripts/validate_action_interpretation_decision_implementation_v1.py
          python scripts/validate_policy_episode_decision_implementation_v1.py
          python scripts/validate_m11f_national_security_policy_episode_acceptance.py
          python scripts/validate_m12f_environment_energy_policy_episode_acceptance.py
          python scripts/validate_m11g_national_security_behavioral_semantic_ir_candidates.py
          python scripts/validate_m12g_environment_energy_behavioral_semantic_ir_candidates.py
          python scripts/validate_m11h_national_security_semantic_ir_acceptance.py
          python scripts/validate_m12h_environment_energy_semantic_ir_acceptance.py
          python scripts/validate_m11i_national_security_synthesis_candidates.py
          python scripts/validate_m12i_environment_energy_synthesis_candidates.py
          python scripts/validate_m11j_national_security_synthesis_acceptance.py
          python scripts/validate_m12j_environment_energy_synthesis_acceptance.py
          python scripts/validate_m11k_national_security_public_wording_candidates.py
          python scripts/validate_m12k_environment_energy_public_wording_candidates.py
          python backend/scripts/build_m11l_national_security_public_wording_acceptance.py --check
          python scripts/validate_public_wording_decision_implementation_v1.py --authority docs/editorial/full_record_reviews/public_wording_implementations/f000477_national_security_foreign_119_v1/human_public_wording_authority.json --implementation docs/editorial/full_record_reviews/public_wording_implementations/f000477_national_security_foreign_119_v1/reviewed_wording_decision_implementation.json --package docs/editorial/full_record_reviews/public_wording_candidates/f000477_national_security_foreign_119_v1/public_wording_candidate_package.json --decision-template docs/editorial/full_record_reviews/public_wording_candidates/f000477_national_security_foreign_119_v1/human_public_wording_decision_template.json --candidate-parity docs/editorial/full_record_reviews/public_wording_candidates/f000477_national_security_foreign_119_v1/parity_manifest.json
          python scripts/validate_m11l_national_security_public_wording_acceptance.py
          python backend/scripts/build_m11m_national_security_site_integration.py --check
          python scripts/validate_m12l_environment_energy_public_wording_acceptance.py
          python backend/scripts/build_m12m_environment_energy_site_integration.py --check
          python backend/scripts/build_m13m_education_workforce_site_integration.py --check
          python scripts/validate_m13m_education_workforce_site_integration.py
          python backend/scripts/foushee_national_security_publication_activation.py build --check
          python scripts/validate_m12n_publication_activation_ratification_candidate.py
          python scripts/build_m12n_environment_energy_ratification_candidate_v3.py --historical-replay
          python scripts/materialize_m12n_environment_energy_activation_authority_v3.py
          python scripts/finalize_m12n_environment_energy_activation_v3.py
          python scripts/validate_m11n_publication_activation_ratification_candidate.py
          python scripts/validate_foushee_justice_semantic_ir_m5r1.py
          python scripts/verify_foushee_justice_launch_review_m6.py
          python scripts/verify_foushee_justice_launch_ratification_m7.py
          python scripts/validate_foushee_justice_benchmark_roles_m8.py
          python scripts/build_foushee_justice_semantic_routing_m10r1.py --check
          python scripts/build_public_review_state_catalog.py --check

      - name: Run full-record integration tests
        run: >-
          python -m pytest -q
          backend/tests/test_full_record_source_readiness.py
          backend/tests/test_m13b_roll19_source_readiness_correction.py
          backend/tests/test_m13c_education_workforce_action_interpretation.py
          backend/tests/test_m13f_education_workforce_policy_episode_acceptance.py
          backend/tests/test_m13g_education_workforce_behavioral_semantic_ir_candidates.py
          backend/tests/test_m13h_education_workforce_semantic_ir_acceptance.py
          backend/tests/test_m13i_education_workforce_synthesis_candidates.py
          backend/tests/test_m13j_education_workforce_synthesis_acceptance.py
          backend/tests/test_m13k_education_workforce_public_wording_candidates.py
          backend/tests/test_m13l_education_workforce_public_wording_acceptance.py
          backend/tests/test_m11a_universe_authority.py
          backend/tests/test_m12a_universe_authority.py
          backend/tests/test_m12b_environment_energy_source_readiness.py
          backend/tests/test_m12c_environment_energy_action_interpretation.py
          backend/tests/test_m12d_environment_energy_action_meaning_acceptance.py
          backend/tests/test_m12e_environment_energy_policy_episode_candidates.py
          backend/tests/test_m12f_environment_energy_policy_episode_acceptance.py
          backend/tests/test_m12g_environment_energy_behavioral_semantic_ir_candidates.py
          backend/tests/test_m12h_environment_energy_semantic_ir_acceptance.py
          backend/tests/test_m12i_environment_energy_synthesis_candidates.py
          backend/tests/test_m12j_environment_energy_synthesis_acceptance.py
          backend/tests/test_m12k_environment_energy_public_wording_candidates.py
          backend/tests/test_full_record_action_interpretation.py
          backend/tests/test_full_record_action_interpretation_decisions.py
          backend/tests/test_full_record_policy_episode_candidates.py
          backend/tests/test_full_record_policy_episode_decisions.py
          backend/tests/test_full_record_behavioral_semantic_ir_candidates.py
          backend/tests/test_full_record_behavioral_semantic_ir_decisions.py
          backend/tests/test_full_record_synthesis_candidates.py
          backend/tests/test_full_record_synthesis_decisions.py
          backend/tests/test_full_record_public_wording_candidates.py
          backend/tests/test_full_record_public_wording_decisions.py
          backend/tests/test_m11m_national_security_site_integration.py
          backend/tests/test_m12l_environment_energy_public_wording_acceptance.py
          backend/tests/test_m12m_environment_energy_site_integration.py
          backend/tests/test_m13m_education_workforce_site_integration.py
          backend/tests/test_m13n_r_education_publication_runtime.py
          backend/tests/test_m13n_r_education_publication_preparation.py
          backend/tests/test_m13n_education_workforce_ratification_candidate.py
          backend/tests/test_m13n_education_workforce_activation_closeout.py
          backend/tests/test_m11n_national_security_publication_activation.py
          backend/tests/test_m12n_environment_energy_ratification_candidate_v3.py
          backend/tests/test_m12n_environment_energy_activation_v3.py
          backend/tests/test_full_issue_universe_authority.py
          backend/tests/test_full_issue_interpretation_source_readiness.py
          backend/tests/test_action_interpretation_decision_implementation_v1.py
          backend/tests/test_policy_episode_decision_implementation_v1.py
          backend/tests/test_foushee_justice_semantic_ir_m5r1.py
          backend/tests/test_foushee_justice_launch_review_m6.py
          backend/tests/test_foushee_justice_launch_ratification_m7.py
          backend/tests/test_foushee_justice_benchmark_roles_m8.py
          backend/tests/test_semantic_review_exception_routing.py
          backend/tests/test_foushee_justice_full_record_activation.py
          backend/tests/test_editorial_public_presentation.py
          backend/tests/test_public_review_state_catalog.py

  amendment-evidence-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run amendment evidence backend tests
        run: >-
          pytest
          tests/test_amendment_evidence.py
          tests/test_source_packets.py
          tests/test_amendment_companion_enrichment.py
          tests/test_supervised_enrichment.py
          tests/test_manual_interpretations.py
          tests/test_senate_evidence_classification.py
          tests/test_senate_enrichment_phase21.py
          tests/test_senate_118_amendment_enrichment.py
          tests/test_evidence_118_expansion.py
          tests/test_session2_evidence_expansion.py
          tests/test_api_positions.py
          tests/test_api_alignment.py

  publication-activation-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_activation
      EDITORIAL_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_activation
      M11N_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_m11n_activation
      M12N_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_m12n_preparation
      M13NR_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_m13nr_preparation
      M13N_DISPOSABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_m13n_candidate
      PUBLICATION_GOVERNANCE_V2_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pf_publication_governance_v2
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install httpx==0.28.1

      - name: Prepare reconciled disposable editorial baseline
        run: |
          createdb -h 127.0.0.1 -U postgres pf_activation
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --seed-foushee-activation-baseline

      - name: Run publication activation PostgreSQL suite without skips
        run: >-
          pytest -q
          backend/tests/test_foushee_justice_publication_activation_postgres.py
          -rs

      - name: Run row-contract and owned-lifecycle fault tests
        run: >-
          python -m pytest -q
          backend/tests/test_api_editorial_presentations.py
          backend/tests/test_foushee_justice_publication_http_proof.py

      - name: Prove M11N authority closure, exact graph, idempotency, drift, and rollback
        run: |
          createdb -h 127.0.0.1 -U postgres pf_m11n_activation
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --database-url-env M11N_DISPOSABLE_DATABASE_URL \
            --seed-foushee-activation-baseline
          pytest -q \
            backend/tests/test_m11n_national_security_publication_activation_postgres.py \
            -rs

      - name: Prove M12N preparation graph, isolation, idempotency, drift, and rollback
        run: |
          createdb -h 127.0.0.1 -U postgres pf_m12n_preparation
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --database-url-env M12N_DISPOSABLE_DATABASE_URL \
            --seed-foushee-activation-baseline
          pytest -q \
            backend/tests/test_m12n_environment_energy_publication_preparation_postgres.py \
            -rs

      - name: Prove M13N-R Education lifecycle, idempotency, drift, and rollback
        run: |
          createdb -h 127.0.0.1 -U postgres pf_m13nr_preparation
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --database-url-env M13NR_DISPOSABLE_DATABASE_URL \
            --seed-foushee-activation-baseline
          pytest -q \
            backend/tests/test_m13n_r_education_publication_preparation_postgres.py \
            -rs

      - name: Prove governed M13N candidate lifecycle and exact public projections
        run: |
          createdb -h 127.0.0.1 -U postgres pf_m13n_candidate
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --database-url-env M13N_DISPOSABLE_DATABASE_URL \
            --seed-foushee-activation-baseline
          pytest -q \
            backend/tests/test_m13n_education_workforce_ratification_candidate_postgres.py \
            -rs

      - name: Prove V2 stable authority with fresh read-only execution evidence
        run: |
          createdb -h 127.0.0.1 -U postgres pf_publication_governance_v2
          python backend/scripts/prepare_editorial_artifact_disposable.py \
            --database-url-env PUBLICATION_GOVERNANCE_V2_DATABASE_URL \
            --seed-foushee-activation-baseline
          pytest -q \
            backend/tests/test_publication_activation_governance_v2.py \
            backend/tests/test_publication_activation_governance_v2_postgres.py \
            -rs

      - name: Build fresh disposable backup evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/foushee-http-proof-source"
          deployed_commit="$(git rev-parse HEAD)"
          mkdir -p "${evidence_dir}"
          createdb -h 127.0.0.1 -U postgres pf_backup_restore
          python backend/scripts/foushee_justice_publication_activation.py \
            preflight \
            --database-url "${DATABASE_URL}" \
            --target disposable \
            --bundle-id foushee_justice_public_safety_119_publication_activation_v1 \
            --deployed-commit "${deployed_commit}" \
            --report-path "${evidence_dir}/preflight-report.json"
          python backend/scripts/foushee_justice_publication_activation.py \
            prepare-backup \
            --database-url "${DATABASE_URL}" \
            --target disposable \
            --bundle-id foushee_justice_public_safety_119_publication_activation_v1 \
            --deployed-commit "${deployed_commit}" \
            --preflight-report "${evidence_dir}/preflight-report.json" \
            --restore-database-url \
              postgresql://postgres:postgres@127.0.0.1:5432/pf_backup_restore \
            --evidence-dir "${evidence_dir}"
          dropdb -h 127.0.0.1 -U postgres pf_backup_restore

      - name: Run authoritative owned-lifecycle real-Uvicorn proof
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/foushee-http-proof-source"
          output_dir="${RUNNER_TEMP}/foushee-http-proof-output"
          deployed_commit="$(git rev-parse HEAD)"
          python backend/scripts/foushee_justice_publication_http_proof.py \
            --deployed-commit "${deployed_commit}" \
            --preflight-report "${evidence_dir}/preflight-report.json" \
            --backup-proof "${evidence_dir}/backup-proof.json" \
            --bundle-id foushee_justice_public_safety_119_publication_activation_v1 \
            --bundle-sha256 \
              df081ea7fc93039926b5a8ac1e468444f30e28b25bb2862bb2980f7d2d83e813 \
            --evidence-dir "${output_dir}"

      - name: Prove no owned proof resources remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq \
            --filter label=political-fingerprint.http-proof-run)"
          test -z "$(docker volume ls -q \
            --filter label=political-fingerprint.http-proof-run)"
          test -z "$(docker network ls -q \
            --filter label=political-fingerprint.http-proof-run)"

  receipt-evidence-repair-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECEIPT_EVIDENCE_REPAIR_DISPOSABLE_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/pf_receipt_repair
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create dedicated disposable database
        run: createdb -h 127.0.0.1 -U postgres pf_receipt_repair

      - name: Prove exact repair apply, idempotency, drift guard, and rollback
        run: >-
          pytest -q
          backend/tests/test_foushee_justice_receipt_evidence_repair_postgres.py
          -rs

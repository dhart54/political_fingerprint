name: Infrastructure shared reuse

on:
  pull_request:
    paths:
      - "backend/app/semantic_ir/**"
      - "backend/app/editorial_presentations/**"
      - "backend/tests/test_infrastructure_shared_reuse148.py"
      - "scripts/prepare_shared_domain_candidate.py"
      - "scripts/validate_infrastructure_shared_reuse148.py"
      - "docs/review_packets/infrastructure_batch148_shared_reuse/**"
      - "docs/review_packets/infrastructure_batch147_va_candidates/**"
      - "docs/review_packets/infrastructure_human_decisions_20261021/**"
      - "docs/editorial/shared_candidates/**"
      - "docs/semantic_ir/**"
      - ".github/workflows/infrastructure-shared-reuse.yml"

permissions:
  contents: read

jobs:
  held-shared-reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Verify whole reuse, preservation and human decision boundaries
        run: |
          git rev-parse HEAD
          python scripts/validate_infrastructure_shared_reuse148.py
          python -m unittest backend.tests.test_infrastructure_shared_reuse148

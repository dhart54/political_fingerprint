name: Infrastructure VA candidates

on:
  pull_request:
    paths:
      - "backend/app/semantic_ir/**"
      - "backend/app/editorial_presentations/**"
      - "backend/tests/test_infrastructure_va_candidates147.py"
      - "scripts/prepare_shared_domain_candidate.py"
      - "scripts/validate_infrastructure_va_candidates147.py"
      - "docs/review_packets/infrastructure_batch147_va_candidates/**"
      - "docs/review_packets/infrastructure_batch144_va_research_administration/**"
      - "docs/editorial/shared_candidates/**"
      - "docs/semantic_ir/**"
      - ".github/workflows/infrastructure-va-candidates.yml"

permissions:
  contents: read

jobs:
  held-va-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Verify frozen sources, current state and held typed replay
        run: |
          git rev-parse HEAD
          python scripts/validate_infrastructure_va_candidates147.py
          python -m unittest backend.tests.test_infrastructure_va_candidates147

name: Render backend smoke

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/render-backend-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/render-backend-smoke.yml"
      - "scripts/render_backend_smoke.py"
      - "scripts/tests/test_render_backend_smoke.py"

jobs:
  read-only-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check contract and failure paths at exact PR head
        run: |
          git rev-parse HEAD
          python -m unittest scripts.tests.test_render_backend_smoke -v
      - name: Check current public deployment without a deploy hook
        env:
          API_BASE_URL: ${{ vars.RENDER_API_BASE_URL || 'https://political-fingerprint.onrender.com' }}
        run: >-
          python scripts/render_backend_smoke.py
          --api-base-url "$API_BASE_URL"
          --output-dir "${{ runner.temp }}/render-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-only-render-smoke
          path: ${{ runner.temp }}/render-smoke
          if-no-files-found: ignore

  deploy-and-smoke:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Note missing Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping deploy hook trigger and running public smoke checks only."

      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait briefly for backend deployment
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: sleep 90

      - name: Smoke check public backend contract
        env:
          API_BASE_URL: ${{ vars.RENDER_API_BASE_URL || 'https://political-fingerprint.onrender.com' }}
        run: |
          args=()
          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            args+=(--expected-commit "$GITHUB_SHA")
          fi
          python scripts/render_backend_smoke.py \
            --api-base-url "$API_BASE_URL" \
            --output-dir "${{ runner.temp }}/render-smoke" \
            "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-backend-smoke
          path: ${{ runner.temp }}/render-smoke
          if-no-files-found: ignore

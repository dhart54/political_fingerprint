name: Infrastructure water resource candidates

on:
  pull_request:
    paths:
      - "backend/app/semantic_ir/**"
      - "backend/app/editorial_presentations/**"
      - "backend/tests/test_infrastructure_water_resource_candidates152.py"
      - "scripts/validate_infrastructure_water_resource_candidates152.py"
      - "scripts/prepare_shared_domain_candidate.py"
      - "docs/review_packets/infrastructure_batch152_water_resources/**"
      - "docs/editorial/shared_candidates/**"
      - "docs/semantic_ir/**"
      - ".github/workflows/infrastructure-water-resource-candidates.yml"

permissions:
  contents: read

jobs:
  held-water-resource-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema and pinned retained PDF validation dependencies
        run: python -m pip install 'jsonschema>=4.23,<5' 'pypdf==6.10.0'
      - name: Verify held whole choices, source versions and conservation
        run: |
          git rev-parse HEAD
          python scripts/validate_infrastructure_water_resource_candidates152.py
          python -m unittest backend.tests.test_infrastructure_water_resource_candidates152

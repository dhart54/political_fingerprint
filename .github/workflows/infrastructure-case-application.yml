name: Infrastructure case application

on:
  pull_request:
    paths:
      - "backend/app/semantic_ir/**"
      - "backend/app/editorial_presentations/**"
      - "backend/tests/test_infrastructure_case_application149.py"
      - "scripts/apply_infrastructure_case_decisions149.py"
      - "scripts/validate_infrastructure_case_application149.py"
      - "scripts/prepare_shared_domain_candidate.py"
      - "docs/review_packets/**"
      - "docs/editorial/shared_candidates/**"
      - "docs/semantic_ir/**"
      - ".github/workflows/infrastructure-case-application.yml"

permissions:
  contents: read

jobs:
  bounded-case-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validation dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Verify exact application, preservation and no-write replay
        run: |
          git rev-parse HEAD
          python scripts/validate_infrastructure_case_application149.py
          python -m unittest backend.tests.test_infrastructure_case_application149
